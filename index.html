<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="description" content="Offline EPUB Reader" />

    <title>My Ebook Reader</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Libraries -->
    <script src="libs/jszip.min.js"></script>
    <script src="libs/epub.min.js"></script>
    <script src="libs/localforage.min.js"></script>
  </head>
  <body>
    <!-- LIBRARY VIEW  -->
    <!-- Library View -->
    <div id="library-view">
      <header class="header">
        <h1>My Books</h1>
        <div class="header-buttons">
          <button id="select-mode-btn" class="btn btn-secondary">Select</button>
          <button id="add-book-btn" class="btn">+ Add Books</button>
          <button
            id="delete-selected-btn"
            class="btn btn-danger"
            style="display: none"
          >
            Delete Selected
          </button>
        </div>
      </header>

      <div class="select-controls" id="select-controls" style="display: none">
        <label> <input type="checkbox" id="select-all" /> Select All </label>
      </div>

      <input type="file" id="file-input" accept=".epub" multiple hidden />

      <div id="continue-section"></div>
      <div id="book-list" class="book-list"></div>

      <p id="empty-message" class="empty-message">
        No books yet.<br />
        Click "+ Add Books" to load EPUB files.
      </p>
    </div>

    <!--  READER VIEW  -->
    <div id="reader-view" class="hidden">
      <header class="reader-header">
        <button id="back-btn" class="btn-icon">←</button>
        <div id="book-title" class="book-title">Loading...</div>
        <button id="hl-list-btn" class="btn-icon" title="Highlights">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z" />
          </svg>
        </button>
        <button id="menu-btn" class="btn-icon">☰</button>
      </header>

      <div id="viewer"></div>

      <div class="reader-controls">
        <button id="prev-btn" class="btn-icon">‹</button>
        <div class="progress-wrap">
          <div id="progress-bar"><div id="progress-fill"></div></div>
          <div id="progress-text"></div>
        </div>
        <button id="next-btn" class="btn-icon">›</button>
      </div>
    </div>

    <!--  HIGHLIGHTS PANEL  -->
    <div id="hl-panel" class="settings-panel hidden">
      <div class="settings-content">
        <h2 id="hl-panel-title">Highlights</h2>
        <div id="hl-list"></div>
        <button id="close-hl-panel" class="btn full-width">Close</button>
      </div>
    </div>

    <!--  SETTINGS PANEL  -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-content">
        <h2>Settings</h2>

        <div class="setting-item">
          <label>Font Size</label>
          <div class="font-controls">
            <button id="font-decrease" class="btn">A-</button>
            <span id="font-size-value">100%</span>
            <button id="font-increase" class="btn">A+</button>
          </div>
        </div>

        <div class="setting-item">
          <label>Theme</label>
          <div class="theme-buttons">
            <button class="theme-btn" data-theme="light">Light</button>
            <button class="theme-btn" data-theme="dark">Dark</button>
            <button class="theme-btn" data-theme="sepia">Sepia</button>
          </div>
        </div>

        <button id="close-settings" class="btn full-width">Close</button>
      </div>
    </div>

    <!-- Highlight color bar -->
    <div id="hl-bar" class="hidden">
      <span id="hl-colors"></span>
      <input type="color" id="hl-custom" value="#a855f7" title="Custom color" />
      <button id="hl-delete" class="hl-act" title="Delete highlight">
        Remove
      </button>
      <button id="hl-cancel" class="hl-act" title="Close">✕</button>
    </div>

    <!-- Main App Logic -->
    <script src="app.js"></script>
    <script src="highlights.js"></script>
  </body>
</html>
