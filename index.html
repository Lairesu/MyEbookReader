<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="description" content="Offline EPUB Reader" />

    <title>My Ebook Reader</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Libraries -->
    <script src="libs/jszip.min.js"></script>
    <script src="libs/epub.min.js"></script>
    <script src="libs/localforage.min.js"></script>
  </head>
  <body>
    <!-- Library View -->
    <div id="library-view">
      <header class="header">
        <h1>My Books</h1>
        <div class="header-buttons">
          <button id="backup-btn" class="btn btn-secondary">Backup</button>
          <button id="select-mode-btn" class="btn btn-secondary">Select</button>
          <button id="add-book-btn" class="btn">+ Add Books</button>
          <button
            id="delete-selected-btn"
            class="btn btn-danger"
            style="display: none"
          >
            Delete Selected
          </button>
        </div>
      </header>

      <div class="select-controls" id="select-controls" style="display: none">
        <label> <input type="checkbox" id="select-all" /> Select All </label>
      </div>

      <input type="file" id="file-input" accept=".epub" multiple hidden />

      <div id="continue-section"></div>
      <div id="book-list" class="book-list"></div>

      <p id="empty-message" class="empty-message" style="display: none">
        No books yet.<br />
        Tap "+ Add Books" to load EPUB files,<br />or open Backup to restore a
        saved library.
      </p>
    </div>

    <!--  READER VIEW  -->
    <div id="reader-view" class="hidden">
      <header class="reader-header">
        <button
          id="back-btn"
          class="btn-icon"
          data-icon="back"
          title="Back"
          aria-label="Back"
        ></button>
        <button
          id="drawer-btn"
          class="btn-icon"
          data-icon="menu"
          title="Chapters, bookmarks, images"
          aria-label="Open menu"
        ></button>
        <div id="book-title" class="book-title">Loading...</div>
        <button
          id="menu-btn"
          class="btn-icon"
          data-icon="settings"
          title="Settings"
          aria-label="Settings"
        ></button>
      </header>

      <div id="viewer"></div>

      <div class="reader-controls">
        <button
          id="prev-btn"
          class="btn-icon"
          data-icon="left"
          title="Previous page"
          aria-label="Previous page"
        ></button>
        <div class="progress-wrap">
          <div id="progress-bar"><div id="progress-fill"></div></div>
          <div id="progress-text"></div>
        </div>
        <button
          id="next-btn"
          class="btn-icon"
          data-icon="right"
          title="Next page"
          aria-label="Next page"
        ></button>
      </div>
    </div>

    <!--  SIDE DRAWER: chapters, bookmarks (highlights), images  -->
    <div id="drawer-backdrop"></div>
    <aside id="drawer" aria-label="Book menu">
      <div class="drawer-top">
        <button
          id="drawer-close"
          class="btn-icon"
          data-icon="back"
          aria-label="Close menu"
        ></button>
        <div class="drawer-tabs">
          <button class="drawer-tab active" data-tab="chapters">
            Chapters
          </button>
          <button class="drawer-tab" data-tab="bookmarks">Bookmarks</button>
          <button
            class="drawer-tab"
            data-tab="images"
            data-icon="image"
            aria-label="Images"
          ></button>
        </div>
        <button
          id="sort-toc"
          class="btn-icon"
          data-icon="sort"
          title="Reverse order"
          aria-label="Reverse chapter order"
        ></button>
      </div>
      <div class="drawer-body">
        <div id="toc-list" class="drawer-view"></div>
        <div id="hl-list" class="drawer-view hidden"></div>
        <div id="img-list" class="drawer-view hidden"></div>
      </div>
      <div id="drawer-footer"></div>
    </aside>
    <div id="lightbox" class="hidden"><img id="lightbox-img" alt="" /></div>

    <!--  BACKUP PANEL  -->
    <div id="backup-panel" class="settings-panel hidden">
      <div class="settings-content">
        <h2>Backup</h2>
        <p class="backup-help">
          Your books live only in this browser. Export a file to keep a copy or
          move your library to another device.
        </p>
        <button id="export-full" class="btn full-width">
          Export everything (books + highlights)
        </button>
        <button id="export-notes" class="btn btn-secondary full-width">
          Export highlights and progress only
        </button>
        <button id="import-btn" class="btn btn-secondary full-width">
          Import backup
        </button>
        <input type="file" id="import-input" accept=".zip" hidden />
        <p id="backup-status"></p>
        <button id="close-backup" class="btn full-width">Close</button>
      </div>
    </div>

    <!--  SETTINGS PANEL  -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="settings-content">
        <h2>Settings</h2>

        <div class="setting-item">
          <label>Font Size</label>
          <div class="font-controls">
            <button id="font-decrease" class="btn">A-</button>
            <span id="font-size-value">100%</span>
            <button id="font-increase" class="btn">A+</button>
          </div>
        </div>

        <div class="setting-item">
          <label>Theme</label>
          <div class="theme-buttons">
            <button class="theme-btn" data-theme="light">Light</button>
            <button class="theme-btn" data-theme="dark">Dark</button>
            <button class="theme-btn" data-theme="sepia">Sepia</button>
          </div>
        </div>

        <div class="setting-item">
          <label for="font-family-select">Font</label>
          <select id="font-family-select">
            <option value="original">Book's own font</option>
            <option value="serif">Serif</option>
            <option value="sans">Sans-serif</option>
            <option value="mono">Monospace</option>
          </select>
        </div>

        <div class="setting-item">
          <label for="line-height-select">Line spacing</label>
          <select id="line-height-select">
            <option value="0">Book's own</option>
            <option value="1.3">Compact</option>
            <option value="1.5">Normal</option>
            <option value="1.8">Relaxed</option>
            <option value="2.1">Wide</option>
          </select>
        </div>

        <div class="setting-item">
          <label
            ><input type="checkbox" id="keep-awake" /> Keep screen awake while
            reading</label
          >
        </div>

        <button id="close-settings" class="btn full-width">Close</button>
      </div>
    </div>

    <!-- Highlight color bar -->
    <div id="hl-bar" class="hidden">
      <span id="hl-colors"></span>
      <input type="color" id="hl-custom" value="#a855f7" title="Custom color" />
      <button
        id="hl-note"
        class="hl-act"
        data-icon="note"
        title="Add or edit note"
        aria-label="Note"
      ></button>
      <button
        id="hl-delete"
        class="hl-act danger"
        data-icon="trash"
        title="Remove highlight"
        aria-label="Remove highlight"
      ></button>
      <button
        id="hl-cancel"
        class="hl-act"
        data-icon="close"
        title="Close"
        aria-label="Close"
      ></button>
    </div>

    <!-- New version prompt -->
    <div id="update-toast" class="hidden" role="status">
      <span>New version available</span>
      <button id="update-reload" class="btn">Reload</button>
      <button
        id="update-dismiss"
        class="btn-icon"
        data-icon="close"
        aria-label="Dismiss"
      ></button>
    </div>

    <!-- Main App Logic -->
    <script src="icons.js"></script>
    <script src="app.js"></script>
    <script src="highlights.js"></script>
    <script src="backup.js"></script>
    <script src="toc.js"></script>
  </body>
</html>
